services:
  - type: web
    name: smxkits
    env: node
    plan: free
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: JWT_SECRET
        generateValue: true
      # Set this in the Render dashboard to a MongoDB Atlas connection string.
      # Without it the app runs on a non-persistent in-memory demo store.
      - key: MONGO_URI
        sync: false
    autoDeploy: true
    healthCheckPath: /health
